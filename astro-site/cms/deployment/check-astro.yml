name: Check Astro changes
on:
  pull_request:
    branches: [main]
    paths: ['astro-site/**', '.github/workflows/check-astro.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: astro-site/.nvmrc
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
