<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Two affine images of the unit square</title><desc id="desc">For A=[[1,3],[0,2]], the unit square maps to the parallelogram with vertices (1,2),(2,2),(5,4),(4,4), area 2. For A=[[1,2],[2,4]], it maps to the segment from (1,2) to (4,8). Both maps add (1,2).</desc><rect width="1080" height="460" rx="14" fill="#f8faf8"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#397664"/></marker></defs><g font-family="Arial,sans-serif" fill="#243b34"><line x1="350" y1="25" x2="350" y2="430" stroke="#d1dcd5" stroke-width="2"/><line x1="720" y1="25" x2="720" y2="430" stroke="#d1dcd5" stroke-width="2"/><text x="40" y="45" font-size="23" fill="#243b34" text-anchor="start">Original set S</text><text x="40" y="79" font-size="18" fill="#243b34" text-anchor="start">Unit square; area = 1</text><text x="390" y="45" font-size="23" fill="#243b34" text-anchor="start">Full rank: f(S)</text><text x="390" y="79" font-size="18" fill="#243b34" text-anchor="start">det(A) = 2; area = 2</text><text x="760" y="45" font-size="23" fill="#243b34" text-anchor="start">Rank 1: g(S)</text><text x="760" y="79" font-size="18" fill="#243b34" text-anchor="start">det(A) = 0; area = 0</text><line x1="48.25" y1="340" x2="287.5" y2="340" stroke="#9cadab" stroke-width="2"/><line x1="70" y1="361.75" x2="70" y2="122.5" stroke="#9cadab" stroke-width="2"/><polygon points="70,340 215,340 215,195 70,195" fill="#dcece2" stroke="#397664" stroke-width="3"/><circle cx="70" cy="340" r="5" fill="#397664"/><text x="48" y="368" font-size="18" fill="#243b34" text-anchor="start">(0, 0)</text><circle cx="215" cy="340" r="5" fill="#397664"/><text x="200" y="368" font-size="18" fill="#243b34" text-anchor="start">(1, 0)</text><circle cx="70" cy="195" r="5" fill="#397664"/><text x="32" y="183" font-size="18" fill="#243b34" text-anchor="start">(0, 1)</text><circle cx="215" cy="195" r="5" fill="#397664"/><text x="210" y="183" font-size="18" fill="#243b34" text-anchor="start">(1, 1)</text><line x1="401.0" y1="340" x2="680" y2="340" stroke="#9cadab" stroke-width="2"/><line x1="410" y1="349.0" x2="410" y2="106.0" stroke="#9cadab" stroke-width="2"/><polygon points="455,250 500,250 635,160 590,160" fill="#dcece2" stroke="#397664" stroke-width="3"/><circle cx="455" cy="250" r="5" fill="#397664"/><text x="420" y="278" font-size="18" fill="#243b34" text-anchor="start">(1, 2)</text><circle cx="500" cy="250" r="5" fill="#397664"/><text x="502" y="278" font-size="18" fill="#243b34" text-anchor="start">(2, 2)</text><circle cx="590" cy="160" r="5" fill="#397664"/><text x="545" y="140" font-size="18" fill="#243b34" text-anchor="start">(4, 4)</text><circle cx="635" cy="160" r="5" fill="#397664"/><text x="635" y="150" font-size="18" fill="#243b34" text-anchor="start">(5, 4)</text><line x1="793.6" y1="375" x2="960" y2="375" stroke="#9cadab" stroke-width="2"/><line x1="800" y1="381.4" x2="800" y2="87" stroke="#9cadab" stroke-width="2"/><line x1="832" y1="311" x2="928" y2="119" stroke="#397664" stroke-width="5"/><circle cx="832" cy="311" r="5" fill="#397664"/><circle cx="864" cy="247" r="5" fill="#397664"/><circle cx="896" cy="183" r="5" fill="#397664"/><circle cx="928" cy="119" r="5" fill="#397664"/><text x="807" y="339" font-size="18" fill="#243b34" text-anchor="start">(1, 2)</text><text x="938" y="119" font-size="18" fill="#243b34" text-anchor="start">(4, 8)</text><text x="40" y="425" font-size="18" fill="#243b34" text-anchor="start">All panels use equal scales on their own x and y axes.</text></g></svg>