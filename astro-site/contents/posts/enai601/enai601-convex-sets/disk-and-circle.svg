<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc"><title id="title">Disk versus circle: a midpoint test</title><desc id="desc">The filled unit disk contains the diameter and midpoint between (-1,0) and (1,0). The circle alone excludes the midpoint (0,0).</desc><rect width="980" height="430" rx="14" fill="#f8faf8"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#397664"/></marker></defs><g font-family="Arial,sans-serif" fill="#243b34"><line x1="490" y1="25" x2="490" y2="400" stroke="#d1dcd5" stroke-width="2"/><text x="245" y="45" font-size="23" fill="#243b34" text-anchor="middle">Filled disk: convex</text><circle cx="245" cy="215" r="125" stroke="#397664" stroke-width="3" fill="#dcece2"/><line x1="90" y1="215" x2="400" y2="215" stroke="#c5cdc9" stroke-width="2"/><line x1="245" y1="65" x2="245" y2="365" stroke="#c5cdc9" stroke-width="2"/><line x1="120" y1="215" x2="370" y2="215" stroke="#397664" stroke-width="4"/><circle cx="120" cy="215" r="5" fill="#397664"/><circle cx="370" cy="215" r="5" fill="#397664"/><circle cx="245" cy="215" r="6" fill="#397664"/><text x="80" y="248" font-size="18" fill="#243b34" text-anchor="middle">(-1, 0)</text><text x="410" y="248" font-size="18" fill="#243b34" text-anchor="middle">(1, 0)</text><text x="245" y="195" font-size="18" fill="#243b34" text-anchor="middle">(0, 0)</text><text x="245" y="395" font-size="20" fill="#243b34" text-anchor="middle">Entire segment is included</text><text x="735" y="45" font-size="23" fill="#243b34" text-anchor="middle">Circle only: not convex</text><circle cx="735" cy="215" r="125" stroke="#397664" stroke-width="3" fill="none"/><line x1="580" y1="215" x2="890" y2="215" stroke="#c5cdc9" stroke-width="2"/><line x1="735" y1="65" x2="735" y2="365" stroke="#c5cdc9" stroke-width="2"/><line x1="610" y1="215" x2="860" y2="215" stroke="#a65e38" stroke-width="4" stroke-dasharray="7 5"/><circle cx="610" cy="215" r="5" fill="#397664"/><circle cx="860" cy="215" r="5" fill="#397664"/><circle cx="735" cy="215" r="6" fill="#a65e38"/><text x="570" y="248" font-size="18" fill="#243b34" text-anchor="middle">(-1, 0)</text><text x="900" y="248" font-size="18" fill="#243b34" text-anchor="middle">(1, 0)</text><text x="735" y="195" font-size="18" fill="#243b34" text-anchor="middle">(0, 0)</text><text x="735" y="395" font-size="20" fill="#243b34" text-anchor="middle">Midpoint is missing</text></g></svg>