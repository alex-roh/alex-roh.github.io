<svg xmlns="http://www.w3.org/2000/svg" width="850" height="620" viewBox="0 0 850 620" role="img" aria-labelledby="title desc"><title id="title">Halfspaces form a triangular feasible set</title><desc id="desc">The region x1 &gt;= 0, x2 &gt;= 0, x1+x2 &lt;= 6 is the filled triangle with vertices (0,0),(6,0),(0,6). The nearest point from the origin to x1+x2=6 is (3,3).</desc><rect width="850" height="620" rx="14" fill="#f8faf8"/><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#397664"/></marker></defs><g font-family="Arial,sans-serif" fill="#243b34"><text x="40" y="40" font-size="24" fill="#243b34" text-anchor="start">P: x1 &gt;= 0, x2 &gt;= 0, x1 + x2 &lt;= 6</text><polygon points="120,510 510,510 120,120" fill="#dcece2" stroke="#397664" stroke-width="2"/><line x1="87.5" y1="510" x2="575" y2="510" stroke="#9cadab" stroke-width="2"/><line x1="120" y1="542.5" x2="120" y2="55" stroke="#9cadab" stroke-width="2"/><line x1="87.5" y1="87.5" x2="542.5" y2="542.5" stroke="#397664" stroke-width="3"/><line x1="120" y1="510" x2="315" y2="315" stroke="#a65e38" stroke-width="3" stroke-dasharray="7 6"/><line x1="315" y1="315" x2="380" y2="250" stroke="#397664" stroke-width="3" marker-end="url(#arrow)"/><circle cx="120" cy="510" r="5" fill="#397664"/><text x="65" y="540" font-size="19" fill="#243b34" text-anchor="start">(0, 0)</text><circle cx="510" cy="510" r="5" fill="#397664"/><text x="525" y="500" font-size="19" fill="#243b34" text-anchor="start">(6, 0)</text><circle cx="120" cy="120" r="5" fill="#397664"/><text x="45" y="115" font-size="19" fill="#243b34" text-anchor="start">(0, 6)</text><circle cx="315" cy="315" r="5" fill="#397664"/><text x="345" y="325" font-size="19" fill="#243b34" text-anchor="start">p = (3, 3)</text><text x="390" y="165" font-size="21" fill="#243b34" text-anchor="start">x1 + x2 = 6</text><text x="395" y="260" font-size="19" fill="#243b34" text-anchor="start">normal a = (1, 1)</text><text x="405" y="210" font-size="18" fill="#92552c" text-anchor="start">distance = 3 sqrt(2)</text><text x="587" y="535" font-size="19" fill="#243b34" text-anchor="start">x1</text><text x="100" y="62" font-size="19" fill="#243b34" text-anchor="start">x2</text><text x="40" y="590" font-size="20" fill="#243b34" text-anchor="start">The shaded triangle includes all three boundary edges.</text></g></svg>