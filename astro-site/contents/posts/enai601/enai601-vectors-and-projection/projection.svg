<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">Orthogonal projection onto y = x</title><desc id="desc">v=(3,1), p=(2,2), residual from p to v is (1,-1). Both axes have the same scale.</desc><rect width="640" height="510" rx="12" fill="#fafbf8"/><defs><marker id="v" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#315ac9"/></marker><marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#168466"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#a35621"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#263348"><line x1="52.0" y1="410" x2="580" y2="410" stroke="#b3bac4" stroke-width="3" /><line x1="100" y1="458.0" x2="100" y2="26.0" stroke="#b3bac4" stroke-width="3" /><line x1="64.0" y1="446.0" x2="448.0" y2="62.0" stroke="#93bcad" stroke-width="3" /><line x1="100" y1="410" x2="460" y2="290" stroke="#315ac9" stroke-width="3" marker-end="url(#v)"/><line x1="100" y1="410" x2="340" y2="170" stroke="#168466" stroke-width="3" marker-end="url(#p)"/><line x1="340" y1="170" x2="460" y2="290" stroke="#a35621" stroke-width="3" marker-end="url(#r)" stroke-dasharray="7 6"/><text x="480" y="300">v = (3, 1)</text><text x="260" y="145">p = (2, 2)</text><text x="385" y="205">r = (1, -1)</text><text x="420" y="68">W: y = x</text><text x="78" y="437">0</text><text x="581" y="433">x</text><text x="75" y="25">y</text><text x="100" y="485" font-size="16">v = p + r,   p in W,   r perpendicular to W</text></g></svg>