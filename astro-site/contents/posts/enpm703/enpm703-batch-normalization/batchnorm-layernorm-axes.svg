<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">BatchNorm과 LayerNorm의 정규화 축 비교</title><desc id="desc">입력행렬은3개sample과2개feature다. BatchNorm은 각 세로 열을 묶어 평균3,14를 계산하고 통계shape는D다. LayerNorm은 각 가로 행을 묶어 평균5.5,8.5,11.5를 계산하고 통계shape는N,1이다. 두 방식 모두 gamma와beta는 feature별D다.</desc><defs><marker id="2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker><marker id="c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker><marker id="047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#047857"/></marker><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs><rect x="1" y="1" width="958" height="588" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#172b4d">Same matrix, different normalization groups</text><text x="480" y="78" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">Each colored group gets its own mean and variance.</text><rect x="25" y="103" width="430" height="419" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="505" y="103" width="430" height="419" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="240" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb">BATCH NORM: columns</text><text x="720" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#047857">LAYER NORM: rows</text><rect x="180" y="190" width="90" height="60" rx="0" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="225" y="228" text-anchor="middle" font-size="26" font-weight="700" fill="#2563eb">1</text><rect x="270" y="190" width="90" height="60" rx="0" fill="#f2edff" stroke="#7c3aed" stroke-width="1.5"/><text x="315" y="228" text-anchor="middle" font-size="26" font-weight="700" fill="#7c3aed">10</text><rect x="180" y="250" width="90" height="60" rx="0" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="225" y="288" text-anchor="middle" font-size="26" font-weight="700" fill="#2563eb">3</text><rect x="270" y="250" width="90" height="60" rx="0" fill="#f2edff" stroke="#7c3aed" stroke-width="1.5"/><text x="315" y="288" text-anchor="middle" font-size="26" font-weight="700" fill="#7c3aed">14</text><rect x="180" y="310" width="90" height="60" rx="0" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="225" y="348" text-anchor="middle" font-size="26" font-weight="700" fill="#2563eb">5</text><rect x="270" y="310" width="90" height="60" rx="0" fill="#f2edff" stroke="#7c3aed" stroke-width="1.5"/><text x="315" y="348" text-anchor="middle" font-size="26" font-weight="700" fill="#7c3aed">18</text><text x="110" y="228" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">sample 1</text><text x="110" y="288" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">sample 2</text><text x="110" y="348" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">sample 3</text><text x="225" y="177" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">feature 1</text><text x="315" y="177" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">feature 2</text><rect x="660" y="190" width="90" height="60" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="705" y="228" text-anchor="middle" font-size="26" font-weight="700" fill="#047857">1</text><rect x="750" y="190" width="90" height="60" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="795" y="228" text-anchor="middle" font-size="26" font-weight="700" fill="#047857">10</text><rect x="660" y="250" width="90" height="60" rx="0" fill="#fff1e9" stroke="#c2410c" stroke-width="1.5"/><text x="705" y="288" text-anchor="middle" font-size="26" font-weight="700" fill="#c2410c">3</text><rect x="750" y="250" width="90" height="60" rx="0" fill="#fff1e9" stroke="#c2410c" stroke-width="1.5"/><text x="795" y="288" text-anchor="middle" font-size="26" font-weight="700" fill="#c2410c">14</text><rect x="660" y="310" width="90" height="60" rx="0" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="705" y="348" text-anchor="middle" font-size="26" font-weight="700" fill="#2563eb">5</text><rect x="750" y="310" width="90" height="60" rx="0" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="795" y="348" text-anchor="middle" font-size="26" font-weight="700" fill="#2563eb">18</text><text x="590" y="228" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">sample 1</text><text x="590" y="288" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">sample 2</text><text x="590" y="348" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">sample 3</text><text x="705" y="177" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">feature 1</text><text x="795" y="177" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">feature 2</text><path d="M225 374 V413" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563eb)"/><text x="225" y="444" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">μ = 3</text><path d="M315 374 V413" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#7c3aed)"/><text x="315" y="444" text-anchor="middle" font-size="22" font-weight="400" fill="#7c3aed">μ = 14</text><path d="M844 220 H873" fill="none" stroke="#047857" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#047857)"/><text x="901" y="227" text-anchor="middle" font-size="21" font-weight="400" fill="#047857">5.5</text><path d="M844 280 H873" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c2410c)"/><text x="901" y="287" text-anchor="middle" font-size="21" font-weight="400" fill="#c2410c">8.5</text><path d="M844 340 H873" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563eb)"/><text x="901" y="347" text-anchor="middle" font-size="21" font-weight="400" fill="#2563eb">11.5</text><text x="240" y="484" text-anchor="middle" font-size="21" font-weight="400" fill="#2563eb">axis = 0; mean shape = (D,)</text><text x="720" y="420" text-anchor="middle" font-size="20" font-weight="400" fill="#047857">row means: 5.5, 8.5, 11.5</text><text x="720" y="484" text-anchor="middle" font-size="20" font-weight="400" fill="#047857">axis = 1; mean shape = (N, 1)</text><text x="480" y="559" text-anchor="middle" font-size="22" font-weight="400" fill="#475569">gamma and beta have shape (D,) in both methods.</text></g></svg>