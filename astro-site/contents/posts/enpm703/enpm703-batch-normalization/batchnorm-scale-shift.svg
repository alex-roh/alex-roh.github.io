<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">정규화와 gamma·beta의 scale·shift</title><desc id="desc">Feature 하나의 세 sample 값1,3,5는 평균3,분산8/3으로 정규화되어 약마이너스1.2247,0,1.2247이 된다. Gamma2와 beta10을 적용하면 약7.5505,10,12.4495이며 평균10과 표준편차2를 갖는다. Epsilon은 생략하고 표시값은 반올림했다.</desc><defs><marker id="2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker><marker id="c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker><marker id="047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#047857"/></marker><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs><rect x="1" y="1" width="958" height="613" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="43" text-anchor="middle" font-size="26" font-weight="700" fill="#172b4d">Normalize first; then learn the output scale and shift</text><text x="480" y="79" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">One feature, three samples: gamma = 2, beta = 10</text><rect x="40" y="111" width="880" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="190" y="153" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">INPUT x</text><text x="190" y="184" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">three sample values</text><text x="620" y="151" text-anchor="middle" font-size="30" font-weight="400" fill="#172b4d">[1, 3, 5]</text><text x="620" y="182" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">mean = 3, variance = 8/3</text><path d="M480 203 V275" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563eb)"/><text x="718" y="244" text-anchor="middle" font-size="17" font-weight="400" fill="#2563eb">subtract mean; divide by standard deviation</text><rect x="40" y="275" width="880" height="92" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="190" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">NORMALIZED x_hat</text><text x="620" y="316" text-anchor="middle" font-size="27" font-weight="400" fill="#2563eb">[−1.2247, 0, 1.2247]</text><text x="620" y="347" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">mean = 0, standard deviation = 1</text><path d="M480 367 V440" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c2410c)"/><text x="715" y="409" text-anchor="middle" font-size="18" font-weight="400" fill="#c2410c">multiply by gamma = 2; add beta = 10</text><rect x="40" y="440" width="880" height="92" rx="12" fill="#fff1e9" stroke="#c2410c" stroke-width="1.5"/><text x="190" y="481" text-anchor="middle" font-size="24" font-weight="700" fill="#c2410c">OUTPUT y</text><text x="620" y="481" text-anchor="middle" font-size="27" font-weight="400" fill="#c2410c">[7.5505, 10, 12.4495]</text><text x="620" y="512" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">mean = 10, standard deviation = 2</text><text x="480" y="583" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">epsilon is omitted here; the displayed vectors are rounded.</text></g></svg>