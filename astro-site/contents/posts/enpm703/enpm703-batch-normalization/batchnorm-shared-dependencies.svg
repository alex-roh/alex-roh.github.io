<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 685" role="img" aria-labelledby="title desc"><title id="title">공유 통계 때문에 sample끼리 연결되는 BatchNorm</title><desc id="desc">한 feature의 입력x1,x2,x3 모두가 평균과 분산을 만든다. 각 출력은 자기 입력의 직접 경로와 공유 통계의 경로를 함께 사용한다. 따라서 x3을 바꾸면 y1과y2도 변할 수 있다. 입력1,3,5와 gamma2에서 dout1,2,0이어도 dx3은 약마이너스0.6124로0이 아니다. 화살표는 forward 의존관계다.</desc><defs><marker id="2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker><marker id="c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker><marker id="047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#047857"/></marker><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs><rect x="1" y="1" width="958" height="683" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#172b4d">A change in x₃ can change all three outputs</text><text x="480" y="78" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">Training BatchNorm: one feature across three samples</text><path d="M144 265 H766" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#64748b)"/><path d="M144 265 H230" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/><path d="M144 365 H766" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#64748b)"/><path d="M144 365 H230" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/><path d="M144 465 H766" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#64748b)"/><path d="M144 465 H230" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/><path d="M230 465 V132 H340" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563eb)"/><rect x="340" y="97" width="280" height="75" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="480" y="128" text-anchor="middle" font-size="21" font-weight="700" fill="#2563eb">SHARED STATISTICS</text><text x="480" y="156" text-anchor="middle" font-size="21" font-weight="400" fill="#172b4d">mean and variance</text><path d="M620 132 H670 V465" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"/><text x="725" y="190" text-anchor="middle" font-size="19" font-weight="400" fill="#c2410c">same stats</text><path d="M670 265 H766" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c2410c)"/><circle cx="110" cy="265" r="34" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="110" y="273" text-anchor="middle" font-size="25" font-weight="700" fill="#2563eb">x1</text><circle cx="800" cy="265" r="34" fill="white" stroke="#c2410c" stroke-width="2.5"/><text x="800" y="273" text-anchor="middle" font-size="25" font-weight="700" fill="#c2410c">y1</text><text x="890" y="272" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">dout = 1</text><path d="M670 365 H766" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c2410c)"/><circle cx="110" cy="365" r="34" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="110" y="373" text-anchor="middle" font-size="25" font-weight="700" fill="#2563eb">x2</text><circle cx="800" cy="365" r="34" fill="white" stroke="#c2410c" stroke-width="2.5"/><text x="800" y="373" text-anchor="middle" font-size="25" font-weight="700" fill="#c2410c">y2</text><text x="890" y="372" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">dout = 2</text><path d="M670 465 H766" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c2410c)"/><circle cx="110" cy="465" r="34" fill="white" stroke="#c2410c" stroke-width="2.5"/><text x="110" y="473" text-anchor="middle" font-size="25" font-weight="700" fill="#c2410c">x3</text><circle cx="800" cy="465" r="34" fill="white" stroke="#c2410c" stroke-width="2.5"/><text x="800" y="473" text-anchor="middle" font-size="25" font-weight="700" fill="#c2410c">y3</text><text x="890" y="472" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">dout = 0</text><text x="110" y="221" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">INPUTS</text><text x="800" y="221" text-anchor="middle" font-size="20" font-weight="700" fill="#c2410c">OUTPUTS</text><rect x="40" y="532" width="880" height="65" rx="12" fill="#fff1e9" stroke="#c2410c" stroke-width="1.5"/><text x="480" y="572" text-anchor="middle" font-size="23" font-weight="700" fill="#c2410c">dout = [1, 2, 0]  →  dx ≈ [−0.6124, 1.2247, −0.6124]</text><text x="480" y="630" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">Dashed: direct path. Solid: dependence through shared statistics.</text><text x="480" y="660" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">Example: x = [1, 3, 5], gamma = 2; epsilon omitted.</text></g></svg>