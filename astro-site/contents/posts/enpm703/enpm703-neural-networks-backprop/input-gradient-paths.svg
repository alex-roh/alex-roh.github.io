<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 625" role="img" aria-labelledby="title desc">
<title id="title">Input gradient sums output paths</title><desc id="desc">입력 x가 output 세 개에 연결된다. 각 경로의 upstream gradient에 weight를 곱한 8, 마이너스 5, 6을 더해 dx 9를 얻는다. 다른 sample의 입력은 이 합에 섞지 않는다.</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker></defs>
<rect x="1" y="1" width="958" height="623" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="43" text-anchor="middle" font-size="26" font-weight="700" fill="#172b4d">dX: 한 입력으로 돌아오는 여러 output 경로를 합한다</text><text x="480" y="78" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">sample 1개 안의 계산 · 파랑: forward / 주황: backward</text><line x1="180" y1="280" x2="554" y2="129" stroke="#2563eb" stroke-width="2.3" marker-end="url(#forward)"/><line x1="554" y1="162" x2="180" y2="310" stroke="#c2410c" stroke-width="2.3" marker-end="url(#back)"/><circle cx="590" cy="145" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="590" y="152" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">y1</text><text x="770" y="152" text-anchor="middle" font-size="23" font-weight="400" fill="#c2410c">dY = 4</text><line x1="180" y1="280" x2="554" y2="279" stroke="#2563eb" stroke-width="2.3" marker-end="url(#forward)"/><line x1="554" y1="312" x2="180" y2="310" stroke="#c2410c" stroke-width="2.3" marker-end="url(#back)"/><circle cx="590" cy="295" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="590" y="302" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">y2</text><text x="770" y="302" text-anchor="middle" font-size="23" font-weight="400" fill="#c2410c">dY = 5</text><line x1="180" y1="280" x2="554" y2="429" stroke="#2563eb" stroke-width="2.3" marker-end="url(#forward)"/><line x1="554" y1="462" x2="180" y2="310" stroke="#c2410c" stroke-width="2.3" marker-end="url(#back)"/><circle cx="590" cy="445" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="590" y="452" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">y3</text><text x="770" y="452" text-anchor="middle" font-size="23" font-weight="400" fill="#c2410c">dY = 2</text><circle cx="145" cy="295" r="33" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="145" y="302" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">x</text><rect x="295" y="148" width="136" height="37" rx="12" fill="#f8fafc" stroke="#f8fafc"/><text x="363" y="173" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">w₁ = 2</text><rect x="297" y="242" width="136" height="37" rx="12" fill="#f8fafc" stroke="#f8fafc"/><text x="365" y="267" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">w₂ = −1</text><rect x="295" y="407" width="136" height="37" rx="12" fill="#f8fafc" stroke="#f8fafc"/><text x="363" y="432" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">w₃ = 3</text><rect x="268" y="203" width="234" height="37" rx="12" fill="#fff1e9" stroke="#fff1e9"/><text x="385" y="228" text-anchor="middle" font-size="21" font-weight="400" fill="#c2410c">g₁ = 4 × 2 = 8</text><rect x="268" y="310" width="234" height="37" rx="12" fill="#fff1e9" stroke="#fff1e9"/><text x="385" y="335" text-anchor="middle" font-size="21" font-weight="400" fill="#c2410c">g₂ = 5 × (−1) = −5</text><rect x="268" y="367" width="234" height="37" rx="12" fill="#fff1e9" stroke="#fff1e9"/><text x="385" y="392" text-anchor="middle" font-size="21" font-weight="400" fill="#c2410c">g₃ = 2 × 3 = 6</text><rect x="125" y="503" width="710" height="60" rx="12" fill="#fff1e9" stroke="#f3b494"/><text x="480" y="542" text-anchor="middle" font-size="26" font-weight="700" fill="#c2410c">dx = g₁ + g₂ + g₃ = 8 − 5 + 6 = 9</text><text x="480" y="596" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">각 g에는 upstream × weight가 이미 포함되어 있다. Weight를 다시 곱하지 않는다.</text></g></svg>