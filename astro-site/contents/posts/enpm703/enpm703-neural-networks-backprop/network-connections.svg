<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Two-layer fully connected network</title><desc id="desc">입력 feature 3개가 hidden unit 4개에 모두 연결되고, hidden unit이 class score 2개에 모두 연결된다. Hidden 값에는 ReLU가 적용된다. Bias 연결은 생략했다.</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker></defs>
<rect x="1" y="1" width="958" height="608" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#172b4d">입력에서 특징을 만들고, 특징에서 class score를 만든다</text><text x="120" y="97" text-anchor="middle" font-size="23" font-weight="400" fill="#172b4d">입력 feature 3개</text><text x="440" y="97" text-anchor="middle" font-size="23" font-weight="400" fill="#172b4d">hidden unit 4개</text><text x="760" y="97" text-anchor="middle" font-size="23" font-weight="400" fill="#172b4d">class score 2개</text><line x1="148" y1="200" x2="412" y2="155" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="200" x2="412" y2="245" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="200" x2="412" y2="335" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="200" x2="412" y2="425" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="300" x2="412" y2="155" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="300" x2="412" y2="245" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="300" x2="412" y2="335" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="300" x2="412" y2="425" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="400" x2="412" y2="155" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="400" x2="412" y2="245" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="400" x2="412" y2="335" stroke="#a6bfee" stroke-width="2.3"/><line x1="148" y1="400" x2="412" y2="425" stroke="#a6bfee" stroke-width="2.3"/><line x1="468" y1="155" x2="732" y2="225" stroke="#b7a9df" stroke-width="2.3"/><line x1="468" y1="155" x2="732" y2="355" stroke="#b7a9df" stroke-width="2.3"/><line x1="468" y1="245" x2="732" y2="225" stroke="#b7a9df" stroke-width="2.3"/><line x1="468" y1="245" x2="732" y2="355" stroke="#b7a9df" stroke-width="2.3"/><line x1="468" y1="335" x2="732" y2="225" stroke="#b7a9df" stroke-width="2.3"/><line x1="468" y1="335" x2="732" y2="355" stroke="#b7a9df" stroke-width="2.3"/><line x1="468" y1="425" x2="732" y2="225" stroke="#b7a9df" stroke-width="2.3"/><line x1="468" y1="425" x2="732" y2="355" stroke="#b7a9df" stroke-width="2.3"/><circle cx="120" cy="200" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="120" y="207" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">x1</text><circle cx="120" cy="300" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="120" y="307" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">x2</text><circle cx="120" cy="400" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="120" y="407" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">x3</text><circle cx="440" cy="155" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="440" y="162" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">h1</text><circle cx="440" cy="245" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="440" y="252" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">h2</text><circle cx="440" cy="335" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="440" y="342" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">h3</text><circle cx="440" cy="425" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="440" y="432" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">h4</text><circle cx="760" cy="225" r="28" fill="white" stroke="#7c3aed" stroke-width="2.5"/><text x="760" y="232" text-anchor="middle" font-size="22" font-weight="400" fill="#7c3aed">s1</text><circle cx="760" cy="355" r="28" fill="white" stroke="#7c3aed" stroke-width="2.5"/><text x="760" y="362" text-anchor="middle" font-size="22" font-weight="400" fill="#7c3aed">s2</text><rect x="200" y="462" width="310" height="51" rx="12" fill="#eef4ff" stroke="#cbd5e1"/><text x="355" y="495" text-anchor="middle" font-size="23" font-weight="400" fill="#172b4d">h = ReLU(xW₁ + b₁)</text><rect x="540" y="462" width="295" height="51" rx="12" fill="#f2edff" stroke="#cbd5e1"/><text x="687" y="495" text-anchor="middle" font-size="23" font-weight="400" fill="#172b4d">s = hW₂ + b₂</text><text x="480" y="551" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">선 하나 = weight 하나 · 원 하나 = 해당 sample의 값 하나</text><text x="480" y="583" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">그림은 sample 1개를 표시한다. Batch 전체에서는 같은 W와 b를 공유한다.</text></g></svg>