<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">Shared weight gradient across two samples</title><desc id="desc">두 sample이 같은 weight w를 사용한다. 입력 2와 4, upstream gradient 10과 20에서 weight gradient는 2 곱하기 10 더하기 4 곱하기 20, 즉 100이다. dY에는 평균 계수가 이미 들어 있다. 파란 화살표는 순전파, 주황 화살표는 역전파다.</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker></defs>
<rect x="1" y="1" width="958" height="588" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="43" text-anchor="middle" font-size="26" font-weight="700" fill="#172b4d">dW: 여러 sample이 쓰는 같은 weight로 기여를 모은다</text><rect x="377" y="66" width="206" height="48" rx="12" fill="#eef4ff" stroke="#cbd5e1"/><text x="480" y="98" text-anchor="middle" font-size="23" font-weight="700" fill="#2563eb">공유 parameter w</text><rect x="34" y="129" width="892" height="141" rx="12" fill="white" stroke="#cbd5e1"/><text x="66" y="167" text-anchor="start" font-size="21" font-weight="400" fill="#475569">Sample A</text><line x1="178" y1="190" x2="437" y2="190" stroke="#2563eb" stroke-width="2.3" marker-end="url(#forward)"/><line x1="708" y1="190" x2="510" y2="190" stroke="#c2410c" stroke-width="2.3" marker-end="url(#back)"/><circle cx="145" cy="190" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="145" y="197" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">xA</text><circle cx="475" cy="190" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="475" y="197" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">yA</text><text x="305" y="176" text-anchor="middle" font-size="23" font-weight="400" fill="#2563eb">× w</text><text x="802" y="197" text-anchor="middle" font-size="23" font-weight="400" fill="#c2410c">dYA = 10</text><text x="145" y="245" text-anchor="middle" font-size="21" font-weight="400" fill="#172b4d">xA = 2</text><text x="530" y="245" text-anchor="middle" font-size="22" font-weight="400" fill="#c2410c">gA = xA · dYA = 2 × 10 = 20</text><rect x="34" y="294" width="892" height="141" rx="12" fill="white" stroke="#cbd5e1"/><text x="66" y="332" text-anchor="start" font-size="21" font-weight="400" fill="#475569">Sample B</text><line x1="178" y1="355" x2="437" y2="355" stroke="#2563eb" stroke-width="2.3" marker-end="url(#forward)"/><line x1="708" y1="355" x2="510" y2="355" stroke="#c2410c" stroke-width="2.3" marker-end="url(#back)"/><circle cx="145" cy="355" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="145" y="362" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">xB</text><circle cx="475" cy="355" r="28" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="475" y="362" text-anchor="middle" font-size="22" font-weight="400" fill="#2563eb">yB</text><text x="305" y="341" text-anchor="middle" font-size="23" font-weight="400" fill="#2563eb">× w</text><text x="802" y="362" text-anchor="middle" font-size="23" font-weight="400" fill="#c2410c">dYB = 20</text><text x="145" y="410" text-anchor="middle" font-size="21" font-weight="400" fill="#172b4d">xB = 4</text><text x="530" y="410" text-anchor="middle" font-size="22" font-weight="400" fill="#c2410c">gB = xB · dYB = 4 × 20 = 80</text><rect x="124" y="462" width="712" height="62" rx="12" fill="#fff1e9" stroke="#f3b494"/><text x="480" y="502" text-anchor="middle" font-size="27" font-weight="700" fill="#c2410c">dw = gA + gB = 20 + 80 = 100</text><text x="480" y="562" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">dY는 최종 평균 loss의 gradient: 1/N이 이미 반영되었다.</text></g></svg>