<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">Adam의 첫 업데이트</title><desc id="desc">첫 gradient2로 m0.2와 v0.004를 만든 뒤 각각0.1과0.001로 나누어 m_hat2와 v_hat4를 얻는다. Learning rate0.001에서 update크기는 약0.001이며 weight1은 약0.999가 된다. Epsilon은 매우 작다고 가정한다.</desc><defs><marker id="2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker><marker id="7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker><marker id="047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#047857"/></marker></defs><rect x="1" y="1" width="958" height="648" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#172b4d">Adam: one gradient, two running averages</text><text x="480" y="73" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">t = 1, m₀ = v₀ = 0, beta₁ = 0.9, beta₂ = 0.999</text><rect x="365" y="96" width="230" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="480" y="134" text-anchor="middle" font-size="26" font-weight="700" fill="#172b4d">g₁ = 2</text><path d="M480 154 V172 H240 V197" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#2563eb)"/><path d="M480 154 V172 H720 V197" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#7c3aed)"/><rect x="45" y="197" width="390" height="95" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="240" y="231" text-anchor="middle" font-size="23" font-weight="700" fill="#2563eb">m: average of g</text><text x="240" y="266" text-anchor="middle" font-size="21" font-weight="400" fill="#172b4d">m₁ = 0.9 × 0 + 0.1 × 2 = 0.2</text><rect x="525" y="197" width="390" height="95" rx="12" fill="#f2edff" stroke="#7c3aed" stroke-width="1.5"/><text x="720" y="231" text-anchor="middle" font-size="23" font-weight="700" fill="#7c3aed">v: average of g²</text><text x="720" y="266" text-anchor="middle" font-size="19" font-weight="400" fill="#172b4d">v₁ = 0.999 × 0 + 0.001 × 4 = 0.004</text><path d="M240 292 V349" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#2563eb)"/><path d="M720 292 V349" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#7c3aed)"/><text x="480" y="328" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">BIAS CORRECTION</text><rect x="45" y="349" width="390" height="77" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="240" y="383" text-anchor="middle" font-size="22" font-weight="400" fill="#172b4d">m_hat = 0.2 / (1 − 0.9)</text><text x="240" y="410" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb">= 2</text><rect x="525" y="349" width="390" height="77" rx="12" fill="#f2edff" stroke="#7c3aed" stroke-width="1.5"/><text x="720" y="383" text-anchor="middle" font-size="22" font-weight="400" fill="#172b4d">v_hat = 0.004 / (1 − 0.999)</text><text x="720" y="410" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3aed">= 4</text><path d="M240 426 V455 H480 V481" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#2563eb)"/><path d="M720 426 V455 H480" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#7c3aed)"/><rect x="105" y="481" width="750" height="91" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="480" y="516" text-anchor="middle" font-size="21" font-weight="400" fill="#047857">step = learning_rate × m_hat / (sqrt(v_hat) + epsilon)</text><text x="480" y="552" text-anchor="middle" font-size="26" font-weight="700" fill="#047857">≈ 0.001 × 2 / 2 = 0.001</text><text x="480" y="616" text-anchor="middle" font-size="26" font-weight="700" fill="#172b4d">w_new = w_old − step ≈ 1 − 0.001 = 0.999</text></g></svg>