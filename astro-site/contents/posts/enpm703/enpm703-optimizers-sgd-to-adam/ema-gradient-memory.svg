<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">지수이동평균에서 과거 gradient의 영향이 줄어드는 과정</title><desc id="desc">초기 평균0, beta0.9, 모든 gradient2일 때 a1은0.2, a2는0.38, a3는0.542다. 세 번째 평균은 g1에0.081, g2에0.09, g3에0.1을 곱해 더한 것이다.</desc><defs><marker id="2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker><marker id="7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker><marker id="047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#047857"/></marker></defs><rect x="1" y="1" width="958" height="508" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="43" text-anchor="middle" font-size="27" font-weight="700" fill="#172b4d">EMA: older gradients gradually lose influence</text><text x="480" y="82" text-anchor="middle" font-size="22" font-weight="400" fill="#475569">a₀ = 0, beta = 0.9, g₁ = g₂ = g₃ = 2</text><rect x="40" y="130" width="250" height="115" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="165" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">STEP 1</text><text x="165" y="195" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">a1 = 0.200</text><text x="165" y="225" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">+ 0.1 × current gradient</text><rect x="355" y="130" width="250" height="115" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="480" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">STEP 2</text><text x="480" y="195" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">a2 = 0.380</text><text x="480" y="225" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">+ 0.1 × current gradient</text><rect x="670" y="130" width="250" height="115" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="795" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">STEP 3</text><text x="795" y="195" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">a3 = 0.542</text><text x="795" y="225" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">+ 0.1 × current gradient</text><path d="M290 184 H355" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#2563eb)"/><text x="322" y="168" text-anchor="middle" font-size="17" font-weight="400" fill="#2563eb">× 0.9</text><path d="M605 184 H670" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#2563eb)"/><text x="637" y="168" text-anchor="middle" font-size="17" font-weight="400" fill="#2563eb">× 0.9</text><rect x="40" y="302" width="880" height="124" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="480" y="344" text-anchor="middle" font-size="27" font-weight="700" fill="#172b4d">a₃ = 0.081g₁ + 0.090g₂ + 0.100g₃</text><text x="480" y="389" text-anchor="middle" font-size="26" font-weight="400" fill="#2563eb">= 0.162 + 0.180 + 0.200 = 0.542</text><text x="480" y="474" text-anchor="middle" font-size="21" font-weight="400" fill="#475569">At step 3, g₁ has been multiplied by beta twice; g₃ is new.</text></g></svg>