<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">Network와 optimizer가 나누어 맡는 학습 과정</title><desc id="desc">Network가 mini-batch의 forward와 backward로 gradient를 계산한다. Optimizer가 weight와 gradient, 이전 config로 next_w와 next_config를 만든다. 갱신된 parameter와 optimizer 상태를 저장하고 다음 batch로 반복한다.</desc><defs><marker id="2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><marker id="c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker><marker id="7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker><marker id="047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#047857"/></marker></defs><rect x="1" y="1" width="958" height="568" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#172b4d">One training update: compute, update, repeat</text><rect x="45" y="110" width="360" height="110" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="225" y="147" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb">NETWORK</text><text x="225" y="179" text-anchor="middle" font-size="22" font-weight="400" fill="#172b4d">forward + backward</text><text x="225" y="205" text-anchor="middle" font-size="18" font-weight="400" fill="#172b4d">model.loss(X_batch, y_batch)</text><rect x="555" y="110" width="360" height="110" rx="12" fill="#fff1e9" stroke="#c2410c" stroke-width="1.5"/><text x="735" y="147" text-anchor="middle" font-size="24" font-weight="700" fill="#c2410c">OPTIMIZER</text><text x="735" y="179" text-anchor="middle" font-size="21" font-weight="400" fill="#172b4d">choose the parameter step</text><text x="735" y="205" text-anchor="middle" font-size="18" font-weight="400" fill="#172b4d">update_rule(w, dw, config)</text><path d="M405 163 H555" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#2563eb)"/><text x="480" y="146" text-anchor="middle" font-size="20" font-weight="400" fill="#2563eb">grads</text><path d="M735 220 V320" fill="none" stroke="#c2410c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#c2410c)"/><text x="803" y="277" text-anchor="middle" font-size="20" font-weight="400" fill="#c2410c">update</text><rect x="555" y="320" width="360" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="735" y="359" text-anchor="middle" font-size="25" font-weight="700" fill="#c2410c">next_w</text><text x="735" y="392" text-anchor="middle" font-size="23" font-weight="400" fill="#172b4d">next_config</text><path d="M555 370 H405" fill="none" stroke="#047857" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#047857)"/><rect x="45" y="320" width="360" height="100" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="225" y="359" text-anchor="middle" font-size="24" font-weight="700" fill="#047857">STORE</text><text x="225" y="392" text-anchor="middle" font-size="19" font-weight="400" fill="#172b4d">updated params + optimizer state</text><path d="M225 320 V220" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#2563eb)"/><text x="143" y="277" text-anchor="middle" font-size="20" font-weight="400" fill="#2563eb">next batch</text><rect x="45" y="465" width="870" height="77" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="480" y="496" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">params return to the network; config stays with the optimizer.</text><text x="480" y="525" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">Changing the optimizer does not change the backward formulas.</text></g></svg>