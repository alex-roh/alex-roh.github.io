<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-labelledby="title desc">
<title id="title">axis=0과 axis=1의 합산 과정</title>
<desc id="desc">3행 4열 원본 배열에서 axis=0은 각 열을 세로로 더해 12,15,18,21을 만들고 axis=1은 각 행을 가로로 더해 6,22,38을 만든다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<style>text {font-family:"Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; fill:#172b3a} .code {font-family:Consolas, monospace} .muted {fill:#475569}</style>
<rect width="1100" height="1060" fill="#fff"/>

<text x="45" y="45" font-size="29" font-weight="700">같은 색의 숫자끼리 더하면 결과 값 하나가 된다</text>
<rect x="25" y="75" width="1050" height="495" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="115" font-size="31" class="code" font-weight="700">A.sum(axis=0)</text>
<text x="50" y="151" font-size="24" >행 인덱스가 바뀌는 방향(세로)으로 더한다 → 열마다 합 하나</text>
<text x="240" y="187" font-size="21" text-anchor="middle" class="muted">열 0</text>
<rect x="190" y="200" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="240.0" y="234.0" font-size="29" text-anchor="middle" class="code">0</text>
<rect x="190" y="254" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="240.0" y="288.0" font-size="29" text-anchor="middle" class="code">4</text>
<rect x="190" y="308" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="240.0" y="342.0" font-size="29" text-anchor="middle" class="code">8</text>
<path d="M240,366 L240,391" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="190" y="401" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="240.0" y="435.0" font-size="29" text-anchor="middle" class="code">12</text>
<text x="360" y="187" font-size="21" text-anchor="middle" class="muted">열 1</text>
<rect x="310" y="200" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="360.0" y="234.0" font-size="29" text-anchor="middle" class="code">1</text>
<rect x="310" y="254" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="360.0" y="288.0" font-size="29" text-anchor="middle" class="code">5</text>
<rect x="310" y="308" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="360.0" y="342.0" font-size="29" text-anchor="middle" class="code">9</text>
<path d="M360,366 L360,391" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="310" y="401" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="360.0" y="435.0" font-size="29" text-anchor="middle" class="code">15</text>
<text x="480" y="187" font-size="21" text-anchor="middle" class="muted">열 2</text>
<rect x="430" y="200" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="480.0" y="234.0" font-size="29" text-anchor="middle" class="code">2</text>
<rect x="430" y="254" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="480.0" y="288.0" font-size="29" text-anchor="middle" class="code">6</text>
<rect x="430" y="308" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="480.0" y="342.0" font-size="29" text-anchor="middle" class="code">10</text>
<path d="M480,366 L480,391" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="401" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="480.0" y="435.0" font-size="29" text-anchor="middle" class="code">18</text>
<text x="600" y="187" font-size="21" text-anchor="middle" class="muted">열 3</text>
<rect x="550" y="200" width="100" height="48" rx="5" fill="#fce7f3" stroke="#94a3b8"/>
<text x="600.0" y="234.0" font-size="29" text-anchor="middle" class="code">3</text>
<rect x="550" y="254" width="100" height="48" rx="5" fill="#fce7f3" stroke="#94a3b8"/>
<text x="600.0" y="288.0" font-size="29" text-anchor="middle" class="code">7</text>
<rect x="550" y="308" width="100" height="48" rx="5" fill="#fce7f3" stroke="#94a3b8"/>
<text x="600.0" y="342.0" font-size="29" text-anchor="middle" class="code">11</text>
<path d="M600,366 L600,391" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="550" y="401" width="100" height="48" rx="5" fill="#fce7f3" stroke="#94a3b8"/>
<text x="600.0" y="435.0" font-size="29" text-anchor="middle" class="code">21</text>
<text x="151" y="233" font-size="21" text-anchor="end" class="muted">행 0</text>
<text x="151" y="287" font-size="21" text-anchor="end" class="muted">행 1</text>
<text x="151" y="341" font-size="21" text-anchor="end" class="muted">행 2</text>
<text x="715" y="250" font-size="23" class="code">입력 shape: (3, 4)</text>
<text x="715" y="290" font-size="22" >행 3개를 하나로 합침</text>
<text x="715" y="425" font-size="23" class="code" font-weight="700">결과 shape: (4,)</text>
<text x="715" y="458" font-size="22" >열 4개의 결과가 남음</text>
<text x="75" y="500" font-size="25" class="code">0 + 4 + 8 = 12 ;     1 + 5 + 9 = 15</text>
<text x="75" y="540" font-size="25" class="code">2 + 6 + 10 = 18 ;     3 + 7 + 11 = 21</text>
<rect x="25" y="595" width="1050" height="380" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="635" font-size="31" class="code" font-weight="700">A.sum(axis=1)</text>
<text x="50" y="671" font-size="24" >열 인덱스가 바뀌는 방향(가로)으로 더한다 → 행마다 합 하나</text>
<rect x="190" y="714" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="240.0" y="748.0" font-size="29" text-anchor="middle" class="code">0</text>
<rect x="310" y="714" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="360.0" y="748.0" font-size="29" text-anchor="middle" class="code">1</text>
<rect x="430" y="714" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="480.0" y="748.0" font-size="29" text-anchor="middle" class="code">2</text>
<rect x="550" y="714" width="100" height="48" rx="5" fill="#dbeafe" stroke="#94a3b8"/>
<text x="600.0" y="748.0" font-size="29" text-anchor="middle" class="code">3</text>
<text x="151" y="746" font-size="21" text-anchor="end" class="muted">행 0</text>
<path d="M665,738 L704,738" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="725" y="746" font-size="24" class="code" font-weight="700">0 + 1 + 2 + 3 = 6</text>
<rect x="190" y="774" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="240.0" y="808.0" font-size="29" text-anchor="middle" class="code">4</text>
<rect x="310" y="774" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="360.0" y="808.0" font-size="29" text-anchor="middle" class="code">5</text>
<rect x="430" y="774" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="480.0" y="808.0" font-size="29" text-anchor="middle" class="code">6</text>
<rect x="550" y="774" width="100" height="48" rx="5" fill="#dcfce7" stroke="#94a3b8"/>
<text x="600.0" y="808.0" font-size="29" text-anchor="middle" class="code">7</text>
<text x="151" y="806" font-size="21" text-anchor="end" class="muted">행 1</text>
<path d="M665,798 L704,798" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="725" y="806" font-size="24" class="code" font-weight="700">4 + 5 + 6 + 7 = 22</text>
<rect x="190" y="834" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="240.0" y="868.0" font-size="29" text-anchor="middle" class="code">8</text>
<rect x="310" y="834" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="360.0" y="868.0" font-size="29" text-anchor="middle" class="code">9</text>
<rect x="430" y="834" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="480.0" y="868.0" font-size="29" text-anchor="middle" class="code">10</text>
<rect x="550" y="834" width="100" height="48" rx="5" fill="#fef3c7" stroke="#94a3b8"/>
<text x="600.0" y="868.0" font-size="29" text-anchor="middle" class="code">11</text>
<text x="151" y="866" font-size="21" text-anchor="end" class="muted">행 2</text>
<path d="M665,858 L704,858" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="725" y="866" font-size="24" class="code" font-weight="700">8 + 9 + 10 + 11 = 38</text>
<text x="240" y="705" font-size="21" text-anchor="middle" class="muted">열 0</text>
<text x="360" y="705" font-size="21" text-anchor="middle" class="muted">열 1</text>
<text x="480" y="705" font-size="21" text-anchor="middle" class="muted">열 2</text>
<text x="600" y="705" font-size="21" text-anchor="middle" class="muted">열 3</text>
<text x="70" y="928" font-size="24" font-weight="700">입력 (3, 4) → 열 4개를 하나로 합침 → 결과 shape: (3,)</text>
<text x="70" y="1017" font-size="26" class="code">axis=None (생략): 모든 원소를 더함 → 66</text>
</svg>